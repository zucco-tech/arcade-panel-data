# mame.ini du panneau lumineux — a poser dans /recalbox/share/bios/mame/ini/
#
# Pourquoi ce fichier existe. Le demon des credits ne peut pas lire la
# memoire de MAME par RetroArch : il faut un script Lua qui tourne dans
# l emulateur (mame-rapport.lua). MAME le lance par l option autoboot_script
# de son mame.ini. Or le coeur de Recalbox impose son propre dossier d ini,
# /usr/share/libretro-mame/mame0278/ini, sur une partition en lecture seule.
#
# L option du coeur « MAME INI Paths » (mame_mame_paths_enable) rend a MAME
# ses chemins standard : il lit alors ce fichier-ci, dans la share. En
# contrepartie, le coeur ne lui passe plus AUCUN chemin — d ou la liste
# ci-dessous, qui reproduit exactement ceux que Recalbox lui donnait.
# Rien n est ecrit hors de /recalbox/share.

# --- les roms et les BIOS, comme Recalbox les range
rompath                   /recalbox/share/roms/mame/mame0278;/recalbox/share/bios;/recalbox/share/bios/mame

# --- ce qui est livre avec le coeur, en lecture
pluginspath               /usr/share/libretro-mame/mame0278/plugins
inipath                   /recalbox/share/bios/mame/ini;/usr/share/libretro-mame/mame0278/ini

# --- les dossiers de la share, comme le coeur les composait
homepath                  /recalbox/share/bios/mame
artpath                   /recalbox/share/bios/mame/artwork
cheatpath                 /recalbox/share/bios/mame/cheat
hashpath                  /recalbox/share/bios/mame/hash
samplepath                /recalbox/share/bios/mame/samples
crosshairpath             /recalbox/share/bios/mame/crosshair
cfg_directory             /recalbox/share/saves/mame/cfg
nvram_directory           /recalbox/share/saves/mame/nvram
input_directory           /recalbox/share/saves/mame/input
state_directory           /recalbox/share/saves/mame/states
snapshot_directory        /recalbox/share/saves/mame/snaps
diff_directory            /recalbox/share/saves/mame/diff

# --- le rapporteur de credits du panneau
autoboot_script           /recalbox/share/system/panneau-arcade/outils/mame-rapport.lua
autoboot_delay            1
