# Les 176 machines structurellement perdues ne sont plus reprises (releve-mame.py,
# RAISONS_SANS_APPEL). Le temps gagne va a la seule poche recuperable : les 118
# jeux qui demarrent, encaissent et convergent, mais dont le START ne confirme
# jamais. On leur donne deux fois plus de pieces, deux fois plus d attente, et
# un START tenu une seconde entiere.
[Service]
Environment=MAME_PIECES=8
Environment=MAME_INSISTANCE=24
Environment=MAME_ATTENTE_START=12
Environment=MAME_TENUE_START=1.0
